name: CI

# Lean PR gate: lint/format/type-check run locally via pre-commit (see
# .pre-commit-config.yaml); this workflow re-runs it as a safety net and adds
# the checks that don't belong in a commit hook — unit tests and the demo
# container build. All jobs run without AWS credentials.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pre-commit's own hook virtualenvs are built by `virtualenv`, which
      # discovers interpreters via PATH — setup-uv's managed 3.14 isn't on
      # PATH, so pre-commit/action can't find `python3.14`
      # (default_language_version in .pre-commit-config.yaml). setup-python
      # registers it on PATH; setup-uv below is still needed for `uv`.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      # Mirrors the local hooks (ruff, ruff-format, file hygiene, actionlint).
      # pyright is SKIPped here — it's a local hook needing the synced project
      # venv; CI runs it in the test job below.
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Unit tests
        run: |
          uv sync --all-packages --all-extras
          uv run --all-packages pytest \
            demo-harness-project/backend/tests test_tenant_app/backend/tests \
            --ignore=demo-harness-project/backend/tests/integration \
            --ignore=test_tenant_app/backend/tests/integration
      - name: Type-check (pyright)
        run: uv run --all-packages pyright

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: demo-harness-project/Dockerfile
          push: false
          load: true
          tags: buyer-team-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        # No real AWS credentials in CI — the app degrades gracefully rather
        # than crashing (background poll loop is a no-op with zero tracked
        # negotiations; /healthz makes no AWS calls). This only proves the
        # image builds and boots, not that it can reach a live tenant.
        run: |
          docker run -d --rm --name demo-smoke -p 8000:8000 \
            -e AWS_REGION=us-east-1 -e AWS_ACCESS_KEY_ID=test -e AWS_SECRET_ACCESS_KEY=test \
            -e ENV=dev -e SKILL_MODE=live \
            buyer-team-demo:ci
          for _ in $(seq 1 15); do
            if curl -sf http://localhost:8000/healthz; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/healthz
          curl -sf http://localhost:8000/ | grep -q "Buyer Team"
          docker logs demo-smoke
          docker stop demo-smoke
