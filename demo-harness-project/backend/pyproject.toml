[project]
name = "demo-harness"
version = "0.1.0"
description = "Buyer Team Lifecycle Demonstration Harness — FastAPI backend"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.27",
    "fastapi>=0.115",
    "pydantic>=2.0",
    "sse-starlette>=2.2",
    "test-tenant-app",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true

[tool.uv.sources]
test-tenant-app = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_harness"]
