services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      AUTH_MODE: dev
      SKILL_MODE: stub
      ENV: dev
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DEV_TENANT_ID: 6eb4ebaf-804e-5837-ae26-f665a76b58dd
      # Live PR→PO trigger (SKILL_MODE=live). Empty under the default stub mode.
      STATE_MACHINE_ARN: ${STATE_MACHINE_ARN:-}
    depends_on:
      - dynamodb-local
      - localstack

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8001:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: us-east-1
