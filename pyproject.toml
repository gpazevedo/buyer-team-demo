[project]
name = "test-tenant-app"
version = "0.1.0"
description = "Buyer Team Test Tenant App — FastAPI backend"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.27",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "pyjwt[crypto]>=2.8",
    "structlog>=24.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.28",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_tenant_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits live AWS resources in us-east-1 (opt-in via RUN_INTEGRATION=1)",
]
